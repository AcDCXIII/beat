<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音符节奏</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #faf8ef;
    color: #776e65;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    text-align: center;
}

.title-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 80px;
    margin-right: 20px;
    color: #776e65;
}

.bpm-control {
    display: flex;
    align-items: center;
    gap: 10px;
}

.bpm-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 6px;
    background-color: #bbada0;
    color: #faf8ef;
    font-size: 26px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
}

.bpm-btn:hover {
    background-color: #a89b8e;
}

.bpm-display {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 32px;
    font-weight: bold;
    color: #776e65;
    cursor: text;
}

.bpm-input {
    width: 4ch;
    font: inherit;
    color: inherit;
    background: transparent;
    border: none;
    outline: none;
    text-align: left;
    -moz-appearance: textfield;
    appearance: textfield;
}

.bpm-input::-webkit-outer-spin-button,
.bpm-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.mode-selector {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
}

.mode-btn {
    padding: 10px 24px;
    border: 2px solid #8f7a66;
    border-radius: 6px;
    background-color: #faf8ef;
    color: #776e65;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.mode-btn:hover {
    background-color: #eee4da;
}

.mode-btn.active {
    background-color: #8f7a66;
    color: #f9f6f2;
}

.container.drag-mode .tile {
    cursor: grab;
}

.container.drag-mode .tile img {
    cursor: grab;
}

.container.drag-mode .tile.drag-over {
    box-shadow: inset 0 0 0 4px #f2b179;
}

.drag-ghost {
    position: fixed;
    width: 110px;
    height: 110px;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0.85;
    z-index: 1000;
}

.drag-ghost img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.game-container {
    position: relative;
    margin: 0 auto;
    width: 635px;
    height: 635px;
    background-color: #bbada0;
    border-radius: 6px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    max-width: 90vw;
    max-height: 90vh;
    transform-origin: top left;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 140px);
    grid-template-rows: repeat(4, 140px);
    gap: 15px;
    width: 100%;
    height: 100%;
}

.tile {
    position: relative;
    width: 140px;
    height: 140px;
    background-color: #cdc1b4;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    transition: all 0.2s ease;
}

.tile img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

.tile-2 {
    background-color: #eee4da;
    color: #776e65;
}

.tile-4 {
    background-color: #ede0c8;
    color: #776e65;
}

.tile-8 {
    background-color: #f2b179;
    color: #f9f6f2;
}

.display-container {
    position: relative;
    margin: 20px auto;
    width: 635px;
    background-color: #bbada0;
    border-radius: 6px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    max-width: 90vw;
    transform-origin: top center;
}

.target-container {
    display: none;
    position: relative;
    margin: 20px auto;
    width: 635px;
    background-color: #bbada0;
    border-radius: 6px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    max-width: 90vw;
}

.container.spell-mode .target-container {
    display: block;
}

.display-title {
    display: none;
    margin-bottom: 10px;
    text-align: left;
    font-size: 18px;
    font-weight: bold;
    color: #f9f6f2;
}

.container.spell-mode .display-title {
    display: block;
}

.display-grid {
    display: grid;
    grid-template-columns: repeat(4, 140px);
    gap: 15px;
    width: 100%;
    height: 140px;
}

.display-tile {
    position: relative;
    width: 140px;
    height: 140px;
    background-color: #cdc1b4;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
}

.display-tile img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

.target-grid {
    display: grid;
    grid-template-columns: repeat(4, 140px);
    gap: 15px;
    width: 100%;
    height: 140px;
}

.target-tile {
    position: relative;
    width: 140px;
    height: 140px;
    background-color: #cdc1b4;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
}

.target-tile img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

.game-container.clearing-note {
    background-color: #f3bcbc;
}

.game-container.clearing-note .tile {
    cursor: pointer;
}

.score-container {
    margin-top: 20px;
    font-size: 24px;
}

.instructions {
    margin-top: 0;
    font-size: 16px;
    color: #776e65;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.dpad {
    display: none;
    grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(3, 34px);
    gap: 2px;
}

.dpad-btn {
    border: none;
    border-radius: 4px;
    background-color: #bbada0;
    color: #f9f6f2;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
}

.dpad-up {
    grid-area: 1 / 2;
}

.dpad-left {
    grid-area: 2 / 1;
}

.dpad-down {
    grid-area: 3 / 2;
}

.dpad-right {
    grid-area: 2 / 3;
}

.container.drag-mode .dpad {
    display: none;
}

.rules p {
    white-space: pre-line;
}

.container.drag-mode .score-container,
.container.drag-mode .items {
    display: none;
}

.game-over {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background-color: rgba(238, 228, 218, 0.75);
    color: #776e65;
    font-size: 48px;
    font-weight: bold;
    border-radius: 6px;
    z-index: 10;
}

.game-over.show {
    display: flex;
}

.items {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 16px;
    color: #776e65;
}

.item-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background-color: #f2b179;
    color: #776e65;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.item-btn:hover {
    background-color: #f0a05a;
}

.item-btn.active {
    background-color: #e06c5b;
    color: #f9f6f2;
}

.restart-btn {
    margin-top: 20px;
    padding: 12px 32px;
    border: none;
    border-radius: 6px;
    background-color: #8f7a66;
    color: #f9f6f2;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.restart-btn:hover {
    background-color: #7f6a56;
}

/* 手机端适配与触摸操作 */
.grid {
    touch-action: none;
}

@media (max-width: 700px) {
    h1 {
        font-size: 40px;
        margin-right: 10px;
    }

    .bpm-btn {
        width: 36px;
        height: 36px;
        font-size: 20px;
    }

    .bpm-display {
        font-size: 22px;
    }

    .mode-selector {
        gap: 6px;
        margin-bottom: 14px;
    }

    .mode-btn {
        padding: 8px 10px;
        font-size: 14px;
    }

    .game-container {
        width: 92vw;
        height: 92vw;
        padding: 2.5vw;
    }

    /* 以正方形格子为基础：列宽 = 容器内宽 87vw 减去 3 个间距后的 1/4 */
    .grid {
        grid-template-columns: repeat(4, 19.875vw);
        grid-template-rows: repeat(4, 19.875vw);
        gap: 2.5vw;
    }

    .tile {
        width: 19.875vw;
        height: 19.875vw;
        overflow: hidden;
    }

    .display-container,
    .target-container {
        width: 92vw;
        padding: 2.5vw;
        margin: 14px auto;
    }

    .display-grid,
    .target-grid {
        grid-template-columns: repeat(4, 19.875vw);
        grid-template-rows: 19.875vw;
        gap: 2.5vw;
        height: auto;
    }

    .display-tile,
    .target-tile {
        width: 19.875vw;
        height: 19.875vw;
        overflow: hidden;
    }

    .dpad {
        display: grid;
    }

    .instructions,
    .rules {
        font-size: 13px;
    }

    .control-row {
        gap: 10px;
        margin-top: 14px;
    }

    .drag-ghost {
        width: 70px;
        height: 70px;
    }
}
</style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <h1>音符节奏</h1>
            <div class="bpm-control">
                <button class="bpm-btn" id="bpm-decrease" type="button" aria-label="降低BPM">−</button>
                <label class="bpm-display" for="bpm-input">
                    <span>BPM:</span>
                    <input class="bpm-input" id="bpm-input" type="number" min="1" max="300" step="1" value="65">
                </label>
                <button class="bpm-btn" id="bpm-increase" type="button" aria-label="提高BPM">+</button>
            </div>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" id="mode-free" type="button">自由模式</button>
            <button class="mode-btn" id="mode-spell" type="button">拼写模式</button>
            <button class="mode-btn" id="mode-drag" type="button">拖拽模式</button>
        </div>
        <div class="game-container">
            <div class="grid"></div>
            <div class="game-over" id="game-over">游戏结束</div>
        </div>
        <div class="target-container">
            <div class="display-title">组合目标</div>
            <div class="target-grid"></div>
        </div>
        <div class="display-container">
            <div class="display-title">组合结果</div>
            <div class="display-grid"></div>
        </div>
        <div class="score-container">
            <div class="score">得分: <span id="score">0</span></div>
        </div>
        <div class="control-row">
            <div class="dpad">
                <button class="dpad-btn dpad-up" data-dir="up" type="button" aria-label="上">▲</button>
                <button class="dpad-btn dpad-left" data-dir="left" type="button" aria-label="左">◀</button>
                <button class="dpad-btn dpad-down" data-dir="down" type="button" aria-label="下">▼</button>
                <button class="dpad-btn dpad-right" data-dir="right" type="button" aria-label="右">▶</button>
            </div>
            <div class="instructions">
                <p id="instructions-text">使用方向键移动方块，合并相同时值的音符！</p>
            </div>
        </div>
        <div class="rules">
            <p id="rules-text">合成顺序为先左后右，先上后下。凑齐横排后消除。</p>
        </div>
        <div class="items">
            <span class="items-label">道具：</span>
            <button class="item-btn" id="clear-note-btn" type="button">清除音符（-40分）</button>
        </div>
        <button class="restart-btn" id="restart-btn" type="button">重新开始</button>
    </div>

    init() {
        this.createGrid();
        this.createDisplayGrid();
        this.createTargetGrid();
        this.addRandomTile(false);
        this.addRandomTile(false);
        this.updateGrid();
        this.updateDisplayGrid();
        this.setupEventListeners();
        this.setupBpmControl();
        this.setupModeSelector();
        this.setupRestartButton();
        this.setupClearNoteItem();
        this.setupDragHandlers();
        this.setupTouchControls();
        this.setupVirtualControls();
        this.initAudio();
        this.resizeGame();
        window.addEventListener('resize', () => this.resizeGame());
    }

    createDisplayGrid() {
        const displayGridElement = document.querySelector('.display-grid');
        displayGridElement.innerHTML = '';
        for (let j = 0; j < 4; j++) {
            const tile = document.createElement('div');
            tile.classList.add('display-tile');
            tile.dataset.col = j;
            displayGridElement.appendChild(tile);
        }
        
        // 添加点击事件监听器，依次播放组件的音效
        displayGridElement.addEventListener('click', () => {
            if (this.displayHasContent) {
                // 手动点击拼合完成的音符组时，同样先播放节拍器
                this.startMetronomePlayback((startTime) => this.playDisplayNotes(startTime));
            }
        });
    }

    createTargetGrid() {
        const targetGridElement = document.querySelector('.target-grid');
        targetGridElement.innerHTML = '';
        for (let j = 0; j < 4; j++) {
            const tile = document.createElement('div');
            tile.classList.add('target-tile');
            tile.dataset.col = j;
            targetGridElement.appendChild(tile);
        }

        // 点击组合目标时播放目标的音效
        targetGridElement.addEventListener('click', () => {
            if (this.mode === 'spell' && this.spellTarget) {
                this.playCodesWithMetronome(this.spellTarget);
            }
        });
    }

    playDisplayNotes(startTime) {
        if (!this.audioContext) return 0;
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }

        const now = this.audioContext.currentTime;
        let noteStart = startTime === undefined ? now : startTime;

        const displayTiles = document.querySelectorAll('.display-tile');
        const notes = [];
        displayTiles.forEach((tile) => {
            const img = tile.querySelector('img');
            if (img && img.dataset.code) {
                notes.push({ code: img.dataset.code, tile });
            }
        });

        if (notes.length === 0) {
            return noteStart;
        }

        const beatDuration = 60 / this.bpm;

        // 从左到右顺序播放，每个音符按1/4拍的网格程序生成打击音
        notes.forEach(({ code, tile }) => {
            for (let i = 0; i < code.length; i++) {
                if (code[i] === '1') {
                    this.playPercussionHit(noteStart + (i / 4) * beatDuration);
                }
            }

            // 视觉上突出显示当前播放的音符
            const noteDuration = (code.length / 4) * beatDuration;
            const showDelay = Math.max(0, (noteStart - now) * 1000);
            setTimeout(() => {
                tile.style.backgroundColor = '#f2b179';
            }, showDelay);
            setTimeout(() => {
                tile.style.backgroundColor = '';
            }, showDelay + noteDuration * 1000);

            noteStart += noteDuration;
        });

        return noteStart;
    }

    resizeGame() {
        const gameContainer = document.querySelector('.game-container');
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        // 重置缩放，获取原始尺寸
        gameContainer.style.transform = 'scale(1)';
        const containerWidth = gameContainer.offsetWidth;
        const containerHeight = gameContainer.offsetHeight;
        
        // 计算缩放比例，确保完全适应窗口
        const scaleX = windowWidth / containerWidth;
        const scaleY = windowHeight / containerHeight;
        const scale = Math.min(scaleX, scaleY, 1); // 最大缩放为1
        
        gameContainer.style.transform = `scale(${scale})`;
        gameContainer.style.transformOrigin = 'top center';
    }

    createGrid() {
        const gridElement = document.querySelector('.grid');
        gridElement.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.row = i;
                tile.dataset.col = j;
                tile.addEventListener('click', () => {
                    // 拖拽结束后的点击不播放音效
                    if (this.suppressClick) return;
                    const { value, code } = this.grid[i][j];
                    // 道具模式：点击一个音符将其清除
                    if (this.clearNoteMode) {
                        if (value > 0) {
                            this.removeNote(i, j);
                        }
                        return;
                    }
                    if (value > 0) {
                        // 手动点击原件时使用与凑齐横排相同的播放逻辑
                        this.startMetronomePlayback((startTime) => {
                            const beatDuration = 60 / this.bpm;
                            if (code) {
                                this.playNoteCode(code, startTime);
                            } else {
                                this.playPercussionHit(startTime);
                            }
                            // 返回该音符播放结束的时间点
                            return startTime + ((code ? code.length : 4) / 4) * beatDuration;
                        });
                    }
                });
                // 拖拽模式：按下音符开始自定义拖拽（兼容鼠标与触摸）
                tile.addEventListener('pointerdown', (e) => {
                    if (this.mode !== 'drag' || this.clearNoteMode || this.gameOver) return;
                    if (this.grid[i][j].value === 0) return;
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    this.dragSource = { i, j };
                    this.dragStartX = e.clientX;
                    this.dragStartY = e.clientY;
                    this.dragActive = false;
                });
                gridElement.appendChild(tile);
            }
        }
    }

    setupDragHandlers() {
        document.addEventListener('pointermove', (e) => this.onTileDragMove(e));
        document.addEventListener('pointerup', (e) => this.onTileDragEnd(e));
        document.addEventListener('pointercancel', () => this.endTileDrag());
    }

    onTileDragMove(e) {
        if (!this.dragSource) return;
        if (!this.dragActive) {
            // 移动超过一定距离才视为拖拽
            if (Math.abs(e.clientX - this.dragStartX) < 8 && Math.abs(e.clientY - this.dragStartY) < 8) return;
            this.dragActive = true;
            this.createDragGhost();
        }
        e.preventDefault();
        this.moveDragGhost(e.clientX, e.clientY);

        const tile = this.getGridTileAt(e.clientX, e.clientY);
        const source = this.dragSource;
        // 自由拖拽：除原格外任意格子都可作为放置目标
        const isValid = tile && (parseInt(tile.dataset.row) !== source.i || parseInt(tile.dataset.col) !== source.j);

        if (this.dragHoverTile && this.dragHoverTile !== tile) {
            this.dragHoverTile.classList.remove('drag-over');
            this.dragHoverTile = null;
        }
        if (isValid) {
            tile.classList.add('drag-over');
            this.dragHoverTile = tile;
        }
    }

    onTileDragEnd(e) {
        if (!this.dragSource) return;
        const source = this.dragSource;
        const active = this.dragActive;
        this.endTileDrag();
        if (!active) return;

        // 拖拽结束后忽略随之触发的点击音效
        this.suppressClick = true;
        setTimeout(() => { this.suppressClick = false; }, 0);

        const tile = this.getGridTileAt(e.clientX, e.clientY);
        if (!tile) return;
        this.handleDragDrop(source.i, source.j, parseInt(tile.dataset.row), parseInt(tile.dataset.col));
    }

    getGridTileAt(x, y) {
        const element = document.elementFromPoint(x, y);
        return element ? element.closest('.tile') : null;
    }

    createDragGhost() {
        const source = this.dragSource;
        const image = document.querySelector(`.tile[data-row="${source.i}"][data-col="${source.j}"] img`);
        if (!image) return;
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        const ghostImage = document.createElement('img');
        ghostImage.src = image.src;
        ghost.appendChild(ghostImage);
        document.body.appendChild(ghost);
        this.dragGhost = ghost;
    }

    moveDragGhost(x, y) {
        if (!this.dragGhost) return;
        this.dragGhost.style.left = `${x}px`;
        this.dragGhost.style.top = `${y}px`;
    }

    endTileDrag() {
        if (this.dragHoverTile) {
            this.dragHoverTile.classList.remove('drag-over');
            this.dragHoverTile = null;
        }
        if (this.dragGhost) {
            this.dragGhost.remove();
            this.dragGhost = null;
        }
        this.dragSource = null;
        this.dragActive = false;
    }

    setupVirtualControls() {
        document.querySelectorAll('.dpad-btn').forEach((button) => {
            button.addEventListener('click', () => {
                if (this.mode === 'drag' || this.clearNoteMode || this.gameOver) return;
                const direction = button.dataset.dir;
                if (direction === 'up') this.moveUp();
                else if (direction === 'down') this.moveDown();
                else if (direction === 'left') this.moveLeft();
                else if (direction === 'right') this.moveRight();
            });
        });
    }

    setupTouchControls() {
        const gridElement = document.querySelector('.grid');

        gridElement.addEventListener('touchstart', (e) => {
            if (this.mode === 'drag' || this.clearNoteMode || e.touches.length !== 1) return;
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
        }, { passive: true });

        gridElement.addEventListener('touchmove', (e) => {
            if (this.mode === 'drag' || this.clearNoteMode) return;
            // 阻止滑动时滚动页面
            e.preventDefault();
        }, { passive: false });

        gridElement.addEventListener('touchend', (e) => {
            if (this.mode === 'drag' || this.clearNoteMode || this.touchStartX === undefined) return;
            const dx = e.changedTouches[0].clientX - this.touchStartX;
            const dy = e.changedTouches[0].clientY - this.touchStartY;
            this.touchStartX = undefined;
            this.touchStartY = undefined;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
            // 滑动后忽略随后的点击音效
            this.suppressClick = true;
            setTimeout(() => { this.suppressClick = false; }, 0);

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) this.moveRight();
                else this.moveLeft();
            } else {
                if (dy > 0) this.moveDown();
                else this.moveUp();
            }
        }, { passive: true });

        gridElement.addEventListener('touchcancel', () => {
            this.touchStartX = undefined;
            this.touchStartY = undefined;
        }, { passive: true });
    }

    handleDragDrop(fromI, fromJ, toI, toJ) {
        const fromCell = this.grid[fromI][fromJ];
        const toCell = this.grid[toI][toJ];

        if (fromCell.value === 0) return;
        // 不能拖回原位
        if (fromI === toI && fromJ === toJ) return;

        const canMerge = toCell.value !== 0 && toCell.value === fromCell.value && toCell.value < 8;

        if (canMerge) {
            const newValue = toCell.value * 2;
            // 组合顺序为目标音符 + 被拖拽音符
            const combinedCode = toCell.code + fromCell.code;
            const mergedNote = this.notes[newValue].find(note => note.code === combinedCode);
            this.grid[toI][toJ] = mergedNote
                ? { value: newValue, note: mergedNote.name, code: mergedNote.code, image: mergedNote.image }
                : { value: newValue, note: toCell.note + fromCell.note, code: combinedCode, image: toCell.image };
            this.grid[fromI][fromJ] = { value: 0, note: '', code: '', image: '' };
        } else {
            // 不能组合时交换位置
            this.grid[toI][toJ] = fromCell;
            this.grid[fromI][fromJ] = toCell;
        }

        this.updateGrid();
        this.addRandomTile();
        this.checkCompleteRow();
        // 简单模式不进行游戏结束检测
    }

    addRandomTile(awardPoints = true) {
        const emptyCells = [];
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                if (this.grid[i][j].value === 0) {
                    emptyCells.push({ i, j });
                }
            }
        }
        if (emptyCells.length > 0) {
            const { i, j } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            const noteObj = this.notes[value][Math.floor(Math.random() * this.notes[value].length)];
            this.grid[i][j] = { value, note: noteObj.name, code: noteObj.code, image: noteObj.image };
            // 自由模式下每产生一个音符按其面值计分
            if (awardPoints && this.mode === 'free') {
                this.addScore(value);
            }
            this.playSound(value);
        }
    }

    addScore(points) {
        this.score += points;
        const scoreElement = document.getElementById('score');
        if (scoreElement) {
            scoreElement.textContent = this.score;
        }
    }

    updateGrid() {
        const tiles = document.querySelectorAll('.tile');
        tiles.forEach(tile => {
            const row = parseInt(tile.dataset.row);
            const col = parseInt(tile.dataset.col);
            const { value, image } = this.grid[row][col];
            tile.innerHTML = '';
            tile.className = 'tile';
            if (value > 0) {
                tile.classList.add(`tile-${value}`);
                const noteElement = document.createElement('img');
                noteElement.src = image;
                noteElement.alt = `Note ${value}`;
                noteElement.draggable = false;
                noteElement.style.width = '80%';
                noteElement.style.height = '80%';
                tile.appendChild(noteElement);
                this.noteElements[`${row}-${col}`] = noteElement;
            }
        });
        document.getElementById('score').textContent = this.score;
    }

    updateDisplayGrid() {
        const displayTiles = document.querySelectorAll('.display-tile');
        displayTiles.forEach(tile => {
            const col = parseInt(tile.dataset.col);
            tile.innerHTML = '';
            tile.className = 'display-tile';
        });
    }

    setupEventListeners() {
        document.addEventListener('keydown', (e) => {
            // 输入BPM、使用清除道具或拖拽模式时方向键不触发游戏移动
            if (e.target === this.bpmInput || this.clearNoteMode || this.mode === 'drag') return;
            switch (e.key) {
                case 'ArrowUp':
                    this.moveUp();
                    break;
                case 'ArrowDown':
                    this.moveDown();
                    break;
                case 'ArrowLeft':
                    this.moveLeft();
                    break;
                case 'ArrowRight':
                    this.moveRight();
                    break;
            }
        });
    }

    setupBpmControl() {
        this.bpmInput = document.getElementById('bpm-input');
        const decreaseBtn = document.getElementById('bpm-decrease');
        const increaseBtn = document.getElementById('bpm-increase');

        decreaseBtn.addEventListener('click', () => this.setBpm(this.bpm - 1));
        increaseBtn.addEventListener('click', () => this.setBpm(this.bpm + 1));

        this.bpmInput.addEventListener('change', () => this.applyBpmInput());
        this.bpmInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                this.applyBpmInput();
                this.bpmInput.blur();
            }
        });

        this.bpmInput.value = this.bpm;
    }

    applyBpmInput() {
        const value = parseInt(this.bpmInput.value, 10);
        if (isNaN(value)) {
            this.bpmInput.value = this.bpm;
            return;
        }
        this.setBpm(value);
    }

    setBpm(value) {
        this.bpm = Math.min(300, Math.max(1, Math.round(value)));
        this.bpmInput.value = this.bpm;
    }

    setupModeSelector() {
        this.containerEl = document.querySelector('.container');
        this.freeModeBtn = document.getElementById('mode-free');
        this.spellModeBtn = document.getElementById('mode-spell');
        this.dragModeBtn = document.getElementById('mode-drag');
        this.freeModeBtn.addEventListener('click', () => this.setMode('free'));
        this.spellModeBtn.addEventListener('click', () => this.setMode('spell'));
        this.dragModeBtn.addEventListener('click', () => this.setMode('drag'));
        this.updateModeButtons();
    }

    setMode(mode) {
        if (this.mode === mode) return;
        this.mode = mode;
        this.updateModeButtons();
        this.restartGame();
    }

    updateModeButtons() {
        this.freeModeBtn.classList.toggle('active', this.mode === 'free');
        this.spellModeBtn.classList.toggle('active', this.mode === 'spell');
        this.dragModeBtn.classList.toggle('active', this.mode === 'drag');
        // 拼写模式和拖拽模式都显示“组合目标”区域和两个区域的标题
        this.containerEl.classList.toggle('spell-mode', this.mode !== 'free');
        this.containerEl.classList.toggle('drag-mode', this.mode === 'drag');

        // 操作方式与合成顺序说明按当前模式的实际逻辑展示
        const instructionsElement = document.getElementById('instructions-text');
        if (instructionsElement) {
            instructionsElement.textContent = this.mode === 'drag'
                ? '拖拽合并相同时值的音符'
                : '使用方向键移动方块，合并相同时值的音符！';
        }

        const rulesElement = document.getElementById('rules-text');
        if (rulesElement) {
            rulesElement.textContent = this.mode === 'drag'
                ? '拖拽合成顺序为“目标音符 + 被拖拽音符”；\n不能合成时两格交换位置。\n凑齐横排后消除。'
                : '合成顺序为先左后右，先上后下。\n凑齐横排后消除。';
        }
    }

    setupRestartButton() {
        document.getElementById('restart-btn').addEventListener('click', () => this.restartGame());
    }

    setupClearNoteItem() {
        this.clearNoteBtn = document.getElementById('clear-note-btn');
        this.clearNoteBtn.addEventListener('click', () => this.toggleClearNoteMode());
    }

    toggleClearNoteMode() {
        if (this.clearNoteMode) {
            this.exitClearNoteMode();
            return;
        }
        // 至少需要40分才能使用道具
        if (this.gameOver || this.score < 40) return;
        this.clearNoteMode = true;
        document.querySelector('.game-container').classList.add('clearing-note');
        this.clearNoteBtn.classList.add('active');
    }

    exitClearNoteMode() {
        this.clearNoteMode = false;
        document.querySelector('.game-container').classList.remove('clearing-note');
        if (this.clearNoteBtn) {
            this.clearNoteBtn.classList.remove('active');
        }
    }

    removeNote(i, j) {
        if (this.score < 40) {
            this.exitClearNoteMode();
            return;
        }
        this.addScore(-40);
        this.grid[i][j] = { value: 0, note: '', code: '', image: '' };
        this.updateGrid();
        this.exitClearNoteMode();
    }

    restartGame() {
        this.stopMetronome();
        this.exitClearNoteMode();
        this.gameOver = false;
        this.score = 0;
        this.spellCombo = 0;
        this.grid = Array(4).fill().map(() => Array(4).fill({ value: 0, note: '', code: '', image: '' }));
        this.updateGrid();
        this.updateDisplayGrid();
        this.displayHasContent = false;
        this.spellTarget = null;
        document.querySelectorAll('.target-tile').forEach(tile => { tile.innerHTML = ''; });
        document.getElementById('game-over').classList.remove('show');

        // 拼写模式和拖拽模式随机生成一组目标音符
        if (this.mode !== 'free') {
            this.generateSpellTarget();
        }

        this.addRandomTile(false);
        this.addRandomTile(false);
        this.updateGrid();
    }

    isGameOver() {
        // 拖拽模式为简单模式，不进行游戏结束检测
        if (this.mode === 'drag') return false;

        // 格子未满时游戏继续
        const hasEmpty = this.grid.some(row => row.some(cell => cell.value === 0));
        if (hasEmpty) return false;

        // 检查上下左右是否有可以拼合的音符
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                const value = this.grid[i][j].value;
                if (value === 0 || value >= 8) continue;
                if (j < 3 && this.grid[i][j + 1].value === value) return false;
                if (i < 3 && this.grid[i + 1][j].value === value) return false;
            }
        }
        return true;
    }

    checkGameOver() {
        if (this.gameOver || !this.isGameOver()) return;
        this.gameOver = true;
        document.getElementById('game-over').classList.add('show');
    }

    moveLeft() {
        let moved = false;
        for (let i = 0; i < 4; i++) {
            const row = this.grid[i].filter(cell => cell.value !== 0);
            const mergedRow = this.merge(row);
            while (mergedRow.length < 4) {
                mergedRow.push({ value: 0, note: '', code: '', image: '' });
            }
            if (!this.arraysEqual(this.grid[i], mergedRow)) {
                this.grid[i] = mergedRow;
                moved = true;
            }
        }
        if (moved) {
            // 自由模式下移动会清除展示区域的内容
            if (this.mode === 'free' && this.displayHasContent) {
                this.updateDisplayGrid();
                this.displayHasContent = false;
            }
            this.addRandomTile();
            this.updateGrid();
            this.checkCompleteRow();
            this.checkGameOver();
        }
    }

    checkCompleteRow() {
        if (this.mode !== 'free') {
            this.checkSpellRow();
            return;
        }

        // 检查是否有横行凑齐了4个8组件，从最上方开始检查
        for (let i = 0; i < 4; i++) {
            const row = this.grid[i];
            const allEights = row.every(cell => cell.value === 8);
            if (allEights) {
                // 闪烁效果
                this.flashRow(i);
                
                // 复制到展示区域
                this.copyToDisplay(row);
                
                // 消去该横行的组件
                this.clearRow(i);

                // 消除横排后额外加8分
                this.addScore(8);

                // 按当前BPM播放节拍器，响两拍后开始播放组成的音符音效，播放结束停止节拍器
                this.startMetronomePlayback((startTime) => this.playDisplayNotes(startTime));
                
                // 标记展示区域有内容
                this.displayHasContent = true;
                
                break; // 只处理最上方的横行
            }
        }
    }

    checkSpellRow() {
        for (let i = 0; i < 4; i++) {
            const row = this.grid[i];
            const allEights = row.every(cell => cell.value === 8);
            if (allEights) {
                const codes = row.map(cell => cell.code);

                this.flashRow(i);
                // 玩家拼成的组合显示在“组合结果”区域
                this.copyToDisplay(row);
                this.displayHasContent = true;
                this.clearRow(i);

                // 只有与随机产生的组合相同才获得分数
                const matched = this.spellTarget && codes.every((code, j) => code === this.spellTarget[j]);
                // 拖拽模式为简单模式，不计分
                if (this.mode === 'spell') {
                    if (matched) {
                        this.spellCombo++;
                        this.addScore(100 + (this.spellCombo - 1) * 50);
                    } else {
                        this.spellCombo = 0;
                    }
                }

                // 只有与组合目标一致时，播放结束后才刷新随机组合
                this.playCodesWithMetronome(codes, matched ? () => this.generateSpellTarget() : undefined);

                break;
            }
        }
    }

    generateSpellTarget() {
        const notes8 = this.notes[8];
        const target = [];
        for (let j = 0; j < 4; j++) {
            const noteObj = notes8[Math.floor(Math.random() * notes8.length)];
            target.push({ value: 8, note: noteObj.name, code: noteObj.code, image: noteObj.image });
        }

        this.spellTarget = target.map(item => item.code);
        // 随机产生的组合显示在“组合目标”区域
        this.copyToTarget(target);
    }

    playCodesWithMetronome(codes, onFinished) {
        this.startMetronomePlayback((startTime) => {
            const beatDuration = 60 / this.bpm;
            let endTime = startTime;
            codes.forEach(code => {
                this.playNoteCode(code, endTime);
                endTime += (code.length / 4) * beatDuration;
            });
            return endTime;
        }, onFinished);
    }

    flashRow(rowIndex) {
        const tiles = document.querySelectorAll('.tile');
        const rowTiles = Array.from(tiles).filter(tile => parseInt(tile.dataset.row) === rowIndex);
        
        // 闪烁两次，间隔0.1秒
        for (let i = 0; i < 2; i++) {
            setTimeout(() => {
                rowTiles.forEach(tile => {
                    tile.style.backgroundColor = 'white';
                });
                setTimeout(() => {
                    rowTiles.forEach(tile => {
                        tile.style.backgroundColor = '';
                    });
                }, 100);
            }, i * 200);
        }
    }

    clearRow(rowIndex) {
        for (let j = 0; j < 4; j++) {
            this.grid[rowIndex][j] = { value: 0, note: '', code: '', image: '' };
        }
        this.updateGrid();
    }

    copyToDisplay(row) {
        this.renderNoteTiles(document.querySelectorAll('.display-tile'), row);
    }

    copyToTarget(row) {
        this.renderNoteTiles(document.querySelectorAll('.target-tile'), row);
    }

    renderNoteTiles(tiles, row) {
        tiles.forEach((tile, index) => {
            const { value, image, code } = row[index];
            tile.innerHTML = '';
            if (value > 0) {
                const noteElement = document.createElement('img');
                noteElement.src = image;
                noteElement.alt = `Note ${value}`;
                noteElement.dataset.code = code; // 存储code信息
                noteElement.draggable = false;
                noteElement.style.width = '80%';
                noteElement.style.height = '80%';
                tile.appendChild(noteElement);
            }
        });
    }

    moveRight() {
        let moved = false;
        for (let i = 0; i < 4; i++) {
            const row = this.grid[i].filter(cell => cell.value !== 0);
            const mergedRow = this.merge(row).reverse();
            while (mergedRow.length < 4) {
                mergedRow.push({ value: 0, note: '', code: '', image: '' });
            }
            const reversedRow = mergedRow.reverse();
            if (!this.arraysEqual(this.grid[i], reversedRow)) {
                this.grid[i] = reversedRow;
                moved = true;
            }
        }
        if (moved) {
            // 自由模式下移动会清除展示区域的内容
            if (this.mode === 'free' && this.displayHasContent) {
                this.updateDisplayGrid();
                this.displayHasContent = false;
            }
            this.addRandomTile();
            this.updateGrid();
            this.checkCompleteRow();
            this.checkGameOver();
        }
    }

    moveUp() {
        let moved = false;
        for (let j = 0; j < 4; j++) {
            const column = [];
            for (let i = 0; i < 4; i++) {
                if (this.grid[i][j].value !== 0) {
                    column.push(this.grid[i][j]);
                }
            }
            const mergedColumn = this.merge(column);
            while (mergedColumn.length < 4) {
                mergedColumn.push({ value: 0, note: '', code: '', image: '' });
            }
            for (let i = 0; i < 4; i++) {
                if (!this.arraysEqual(this.grid[i][j], mergedColumn[i])) {
                    this.grid[i][j] = mergedColumn[i];
                    moved = true;
                }
            }
        }
        if (moved) {
            // 自由模式下移动会清除展示区域的内容
            if (this.mode === 'free' && this.displayHasContent) {
                this.updateDisplayGrid();
                this.displayHasContent = false;
            }
            this.addRandomTile();
            this.updateGrid();
            this.checkCompleteRow();
            this.checkGameOver();
        }
    }

    moveDown() {
        let moved = false;
        for (let j = 0; j < 4; j++) {
            const column = [];
            for (let i = 0; i < 4; i++) {
                if (this.grid[i][j].value !== 0) {
                    column.push(this.grid[i][j]);
                }
            }
            const mergedColumn = this.merge(column).reverse();
            while (mergedColumn.length < 4) {
                mergedColumn.push({ value: 0, note: '', code: '', image: '' });
            }
            const reversedColumn = mergedColumn.reverse();
            for (let i = 0; i < 4; i++) {
                if (!this.arraysEqual(this.grid[i][j], reversedColumn[i])) {
                    this.grid[i][j] = reversedColumn[i];
                    moved = true;
                }
            }
        }
        if (moved) {
            // 自由模式下移动会清除展示区域的内容
            if (this.mode === 'free' && this.displayHasContent) {
                this.updateDisplayGrid();
                this.displayHasContent = false;
            }
            this.addRandomTile();
            this.updateGrid();
            this.checkCompleteRow();
            this.checkGameOver();
        }
    }

    merge(row) {
        for (let i = 0; i < row.length - 1; i++) {
            if (row[i].value === row[i + 1].value && row[i].value < 8) {
                const newValue = row[i].value * 2;
                const mergedNote = this.getMergedNote(row[i], row[i + 1], newValue);
                row[i] = mergedNote;
                row.splice(i + 1, 1);
                // 只有自由模式的拼合计分
                if (this.mode === 'free') {
                    this.addScore(newValue);
                }
            }
        }
        return row;
    }

    getMergedNote(note1, note2, newValue) {
        // 根据先左后右、先上后下的顺序排列枚举
        if (newValue === 4) {
            // 2组件合并为4组件
            const combinedCode = note1.code + note2.code;
            for (const noteObj of this.notes[4]) {
                if (noteObj.code === combinedCode) {
                    return { value: 4, note: noteObj.name, code: noteObj.code, image: noteObj.image };
                }
            }
        } else if (newValue === 8) {
            // 4组件合并为8组件
            const combinedCode = note1.code + note2.code;
            for (const noteObj of this.notes[8]) {
                if (noteObj.code === combinedCode) {
                    return { value: 8, note: noteObj.name, code: noteObj.code, image: noteObj.image };
                }
            }
        }
        // 如果没有找到匹配的，返回第一个
        const noteObj = this.notes[newValue][0];
        return { value: newValue, note: noteObj.name, code: noteObj.code, image: noteObj.image };
    }

    arraysEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
    }

    initAudio() {
        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.noiseBuffer = this.createNoiseBuffer();
        } catch (e) {
            console.log('Audio context not supported');
        }
    }

    createNoiseBuffer() {
        if (!this.audioContext) return null;
        const length = Math.floor(this.audioContext.sampleRate * 0.2);
        const buffer = this.audioContext.createBuffer(1, length, this.audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        return buffer;
    }

    startMetronomePlayback(playNotes, onFinished) {
        if (!this.audioContext) return;
        this.startMetronome();
        const session = this.soundSession;
        const beatDuration = 60 / this.bpm;
        // 节拍器响两拍后开始播放音符，与节拍器共用同一音频时钟基准
        const startTime = this.metronomeOrigin + beatDuration * 2;

        this.pendingPlaybackTimer = setTimeout(() => {
            this.pendingPlaybackTimer = null;
            if (session !== this.soundSession) return;

            const endTime = playNotes(startTime);
            // 播放结束后停止节拍器
            setTimeout(() => {
                if (session === this.soundSession) {
                    this.stopMetronome();
                    if (onFinished) {
                        onFinished();
                    }
                }
            }, Math.max(0, (endTime - this.audioContext.currentTime) * 1000));
        }, beatDuration * 2 * 1000);
    }

    startMetronome(bpm) {
        this.stopMetronome();
        if (!this.audioContext) return;
        if (bpm === undefined) bpm = this.bpm;
        // 音频上下文可能因自动播放策略处于挂起状态，需在用户操作中恢复
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }
        this.soundSession++;
        // 以音频时钟为基准记录起始时间，保证每一拍的时间点精确，便于音符对齐
        this.metronomeOrigin = this.audioContext.currentTime;
        this.metronomeBeatIndex = 0;

        const beat = 60 / bpm;
        const tick = () => {
            const when = this.metronomeOrigin + this.metronomeBeatIndex * beat;
            this.playMetronomeClick(when);
            this.metronomeBeatIndex++;
        };

        tick();
        this.metronomeTimer = setInterval(tick, beat * 1000);
    }

    stopMetronome() {
        if (this.metronomeTimer) {
            clearInterval(this.metronomeTimer);
            this.metronomeTimer = null;
        }
        if (this.pendingPlaybackTimer) {
            clearTimeout(this.pendingPlaybackTimer);
            this.pendingPlaybackTimer = null;
        }
    }

    playMetronomeClick(when) {
        if (!this.audioContext) return;
        if (when === undefined) {
            when = this.audioContext.currentTime;
        }
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(this.audioContext.destination);

        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(1000, when);
        gainNode.gain.setValueAtTime(0.2, when);
        gainNode.gain.exponentialRampToValueAtTime(0.001, when + 0.05);

        oscillator.start(when);
        oscillator.stop(when + 0.05);
    }

    playSound(value, code) {
        if (!this.audioContext) return;
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }
        const startTime = this.audioContext.currentTime;
        if (code) {
            // 按音符code程序生成打击音
            this.playNoteCode(code, startTime);
        } else {
            // 没有code时只产生一个打击音
            this.playPercussionHit(startTime);
        }
    }

    playNoteCode(code, startTime) {
        if (!this.audioContext || !code) return;
        const beatDuration = 60 / this.bpm;
        // 一拍分为4份，'1'表示在该份开头产生打击音
        for (let i = 0; i < code.length; i++) {
            if (code[i] === '1') {
                this.playPercussionHit(startTime + (i / 4) * beatDuration);
            }
        }
    }

    playPercussionHit(when) {
        if (!this.audioContext) return;
        if (when === undefined) {
            when = this.audioContext.currentTime;
        }
        const audioContext = this.audioContext;

        // 噪声部分：带通滤波的白噪声，模拟小军鼓的沙沙声
        if (this.noiseBuffer) {
            const noise = audioContext.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const noiseFilter = audioContext.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(1800, when);
            noiseFilter.Q.setValueAtTime(0.8, when);
            const noiseGain = audioContext.createGain();
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioContext.destination);
            noiseGain.gain.setValueAtTime(0.35, when);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, when + 0.12);
            noise.start(when);
            noise.stop(when + 0.15);
        }

        // 鼓体部分：低频音快速衰减，模拟小军鼓鼓皮的撞击
        const body = audioContext.createOscillator();
        const bodyGain = audioContext.createGain();
        body.connect(bodyGain);
        bodyGain.connect(audioContext.destination);
        body.type = 'triangle';
        body.frequency.setValueAtTime(200, when);
        body.frequency.exponentialRampToValueAtTime(90, when + 0.06);
        bodyGain.gain.setValueAtTime(0.25, when);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, when + 0.08);
        body.start(when);
        body.stop(when + 0.1);
    }
}

// 启动游戏
new Game2048();
</script>
